<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:body>
        <ui:composition template="/plantillas/layout.xhtml">
            <ui:define name="content">
                <div style="display: flex; justify-content: center; align-items: center; height: 80vh; background: linear-gradient(135deg, #2c3e50 0%, #3498db 50%, #2c3e50 100%);">
                    
                    <p:panel header="🔐 Iniciar Sesión - Perfumería" style="width: 28rem; text-align: center; border-radius: 12px; border: none; box-shadow: 0 8px 25px rgba(0,0,0,0.2); background: rgba(255, 255, 255, 0.95);">
                        
                        <h:form id="formLogin">
                            <p:messages id="msgLogin" showDetail="true" closable="true" style="margin-bottom: 15px;" />

                            <div style="margin-bottom: 15px; text-align: left;">
                                <h:outputLabel for="usuario" value="Usuario" style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50;" />
                                <p:inputText id="usuario" value="#{loginBean.usuario}" required="true" requiredMessage="Ingrese su usuario" style="width: 100%; border-radius: 6px;" placeholder="Ej. admin" />
                            </div>
                            
                            <div style="margin-bottom: 20px; text-align: left;">
                                <h:outputLabel for="clave" value="Contraseña" style="display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50;" />
                                <p:password id="clave" value="#{loginBean.clave}" required="true" requiredMessage="Ingrese su contraseña" style="width: 100%; border-radius: 6px;" placeholder="Ej. 1234" />
                            </div>
                            
                            <p:commandButton value="Entrar" action="#{loginBean.iniciarSesion()}" update="formLogin" icon="ui-icon-check" styleClass="ui-button-success" style="width: 100%; border-radius: 8px; font-weight: bold; padding: 8px; background: #27ae60; border: none; color: white; margin-bottom: 10px;" />
                            
                            <div style="margin-top: 15px;">
                                <p:button outcome="/index" value="Volver al Catálogo" icon="ui-icon-home" styleClass="ui-button-flat" style="color: #2c3e50; font-weight: bold;" />
                            </div>
                        </h:form>
                    </p:panel>

                </div>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
