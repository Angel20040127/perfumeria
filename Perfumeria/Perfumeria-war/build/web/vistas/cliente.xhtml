<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:body>
        <ui:composition template="/plantillas/layout.xhtml">
            <ui:define name="content">
                <div class="fondo-degradado">
                    
                    <p:growl id="messagesCliente" showDetail="true" />

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: rgba(255, 255, 255, 0.95); padding: 18px 25px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);">
                        <h:outputText value="🛍️ Panel de Cliente - Catálogo de Perfumes" style="font-size: 24px; font-weight: bold; color: #2c3e50;" />
                        
                        <h:panelGroup id="panelCarritoCliente">
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <span style="color: #2c3e50; font-weight: bold;">Bienvenido, #{loginBean.usuario}</span>
                                
                                <p:button outcome="/vistas/carrito" value="Mi Carrito (#{catalogoBean.cantidadCarrito})" icon="pi pi-shopping-cart" styleClass="ui-button-warning" style="font-weight: bold; border-radius: 8px; background: #e67e22; border: none; color: white;" />

                                <h:form style="margin: 0; display: inline;">
                                    <h:commandButton value="Cerrar Sesión" action="#{loginBean.cerrarSesion()}" 
                                                     style="background: #c0392b; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer;" />
                                </h:form>
                            </div>
                        </h:panelGroup>
                    </div>
                    
                    <h:form id="formCatalogoCliente">
                        <p:panel style="margin-bottom: 25px; border-radius: 12px; border: none; box-shadow: 0 6px 20px rgba(0,0,0,0.1); background: rgba(255, 255, 255, 0.95);">
                            <p:tabMenu activeIndex="0">
                                <p:menuitem value="Todos" action="#{catalogoBean.filtrarPor('Todos')}" update="@form"/>
                                <p:menuitem value="Caballero" action="#{catalogoBean.filtrarPor('Caballero')}" update="@form"/>
                                <p:menuitem value="Dama" action="#{catalogoBean.filtrarPor('Dama')}" update="@form"/>
                                <p:menuitem value="Unisex" action="#{catalogoBean.filtrarPor('Unisex')}" update="@form"/>
                            </p:tabMenu>
                        </p:panel>

                        <!-- Indicador de categoría -->
                        <div style="margin-bottom: 20px; font-size: 16px; font-weight: 600; color: #ffffff; background: rgba(0, 0, 0, 0.3); padding: 10px 20px; border-radius: 8px; display: inline-block; backdrop-filter: blur(5px);">
                            📁 Categoría actual: <span style="color: #f1c40f; font-weight: bold;">#{catalogoBean.categoriaActual}</span>
                        </div>

                        <!-- Cuadrícula de Perfumes -->
                        <div style="display: flex; flex-wrap: wrap; gap: 25px; justify-content: flex-start;">
                            <ui:repeat value="#{catalogoBean.listaPerfumes}" var="perfume">
                                <div style="flex: 1 1 280px; max-width: 320px;">
                                    <p:panel header="#{perfume.nombre}" style="height: 100%; text-align: center; border-radius: 12px; border: none; box-shadow: 0 8px 25px rgba(0,0,0,0.15); background: #ffffff;">
                                        
                                        <div style="margin-bottom: 12px;">
                                            <img src="#{perfume.imagenUrl}" alt="#{perfume.nombre}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 8px;" />
                                        </div>

                                        <div style="margin-bottom: 12px;">
                                            <span style="background-color: #fef9e7; color: #d4ac0d; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid #f9e79f;">
                                                #{perfume.categoria}
                                            </span>
                                        </div>
                                        
                                        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 15px; min-height: 40px;">
                                            #{perfume.descripcion}
                                        </p>
                                        
                                        <h:outputText value="#{perfume.precio}" style="font-size: 22px; font-weight: bold; color: #27ae60; display: block; margin-bottom: 20px;">
                                            <f:convertNumber type="currency" currencySymbol="$" />
                                        </h:outputText>
                                        
                                        <p:commandButton value="Añadir al Carrito" 
                                                         action="#{catalogoBean.prepararConfirmacion(perfume)}"
                                                         update="@form"
                                                         icon="ui-icon-plusthick" 
                                                         styleClass="ui-button-raised" 
                                                         style="width: 100%; border-radius: 8px; font-weight: bold; padding: 8px; background: #2c3e50; border: none; color: white;" />
                                    </p:panel>
                                </div>
                            </ui:repeat>
                        </div>

                        <p:dialog id="dlgConfirmacionCliente" header="Confirmación de Compra" widgetVar="dialogoConfirmarCliente" 
                                  modal="true" visible="#{catalogoBean.mostrarDialogo}" closable="false" resizable="false" 
                                  style="background: white; border-radius: 8px; padding: 10px;">
                            <h:outputText value="¿Desea agregar #{catalogoBean.perfumeSeleccionado.nombre} al carrito?" style="font-size: 15px; display: block; margin-bottom: 20px;" />
                            <div style="text-align: right; display: flex; gap: 10px; justify-content: flex-end;">
                                <!-- Actualiza los mensajes, el formulario y el panel superior del carrito para reflejar la cantidad -->
                                <p:commandButton value="Sí, Seguro" action="#{catalogoBean.confirmarAgregarAlCarrito()}" 
                                                 update=":messagesCliente formCatalogoCliente :panelCarritoCliente" icon="ui-icon-check" styleClass="ui-button-success" />
                                <p:commandButton value="No aún" action="#{catalogoBean.cancelarConfirmacion()}" 
                                                 update="@form" icon="ui-icon-close" styleClass="ui-button-secondary" />
                            </div>
                        </p:dialog>
                    </h:form>

                </div>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
