<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:body>
        <ui:composition template="/plantillas/layout.xhtml">
            <ui:define name="content">
                <div style="padding: 20px;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h:outputText value="Catálogo de Perfumes" style="font-size: 24px; font-weight: bold;" />
                        <div>
                            <p:button outcome="/vistas/carrito" value="Carrito (#{catalogoBean.cantidadCarrito})" icon="pi pi-shopping-cart" styleClass="ui-button-success" style="margin-right: 10px;" />
                            <p:button outcome="/index" value="Volver al Inicio" icon="pi pi-home" />
                        </div>
                    </div>
                    
                    <h:form id="formCatalogo">
                        <p:panel style="margin-bottom: 20px;">
                            <p:tabMenu activeIndex="0">
                                <p:menuitem value="Todos" icon="pi pi-home" action="#{catalogoBean.filtrarPor('Todos')}" update="formCatalogo"/>
                                <p:menuitem value="Caballero" icon="pi pi-user" action="#{catalogoBean.filtrarPor('Caballero')}" update="formCatalogo"/>
                                <p:menuitem value="Dama" icon="pi pi-heart" action="#{catalogoBean.filtrarPor('Dama')}" update="formCatalogo"/>
                                <p:menuitem value="Unisex" icon="pi pi-th-large" action="#{catalogoBean.filtrarPor('Unisex')}" update="formCatalogo"/>
                            </p:tabMenu>
                        </p:panel>

                        <p:panel header="Mostrando perfumes de la categoría: #{catalogoBean.categoriaActual}" style="margin-bottom: 20px;" />

                        <div style="display: flex; flex-wrap: wrap; gap: 20px;">
                            <ui:repeat value="#{catalogoBean.listaPerfumes}" var="perfume">
                                <div style="flex: 1 1 300px; max-width: 350px;">
                                    <p:panel header="#{perfume.nombre}" style="height: 100%; text-align: center;">
                                        <div style="margin-bottom: 10px;">
                                            <span class="ui-badge">#{perfume.categoria}</span>
                                        </div>
                                        <p style="color: #666; margin-bottom: 15px;">#{perfume.descripcion}</p>
                                        <h:outputText value="#{perfume.precio}" style="font-size: 20px; font-weight: bold; color: #2e7d32; display: block; margin-bottom: 15px;">
                                            <f:convertNumber type="currency" currencySymbol="$" />
                                        </h:outputText>
                                        <p:commandButton value="Añadir al Carrito" action="#{catalogoBean.agregarAlCarrito(perfume)}" update="formCatalogo" icon="pi pi-shopping-cart" styleClass="ui-button-outlined"/>
                                    </p:panel>
                                </div>
                            </ui:repeat>
                        </div>
                    </h:form>

                </div>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
